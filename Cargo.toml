[package]
name = "plugward"
version = "0.4.0-alpha.2"
edition = "2021"
rust-version = "1.85"
description = "A GNOME USBGuard security center with activity, policy review and scoped authorization"
license = "MIT"
repository = "https://github.com/tobiasGuta/PlugWard"
keywords = ["usbguard", "gnome", "usb", "security"]
categories = ["gui"]

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }

[lints.rust]
unsafe_code = "forbid"
